name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lint:
    name: Lint
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            src/communicator_app/requirements.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install go-task-bin
          python -m pip install -r requirements-dev.txt
          python -m pip install -r src/communicator_app/requirements.txt

      - name: Run lint
        id: run_lint
        continue-on-error: true
        run: |
          set -o pipefail
          task lint:all 2>&1 | tee lint-output.txt

      - name: Add lint summary
        if: always()
        env:
          LINT_OUTCOME: ${{ steps.run_lint.outcome }}
        run: |
          {
            echo "## Lint Result"
            echo ""
            if [ "$LINT_OUTCOME" = "success" ]; then
              echo "- Status: :white_check_mark: Passed"
            else
              echo "- Status: :x: Failed"
              echo ""
              echo "### Lint failure excerpt"
              echo '```text'
              if [ -f lint-output.txt ]; then
                tail -n 40 lint-output.txt
              else
                echo "No lint output captured."
              fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post lint result on PR page
        if: always() && github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            const marker = '<!-- pr-lint-comment -->';
            const lintPassed = '${{ steps.run_lint.outcome }}' === 'success';
            const statusLine = lintPassed ? '- Status: ✅ Passed' : '- Status: ❌ Failed';

            let excerptBlock = '';
            if (!lintPassed) {
              let excerpt = 'No lint output captured.';
              if (fs.existsSync('lint-output.txt')) {
                const lines = fs.readFileSync('lint-output.txt', 'utf8').trimEnd().split(/\r?\n/);
                excerpt = lines.slice(-80).join('\n') || excerpt;
              }
              excerptBlock = `\n\n### Lint failure excerpt\n\`\`\`text\n${excerpt}\n\`\`\``;
            }

            const body = `${marker}\n### Lint Result\n${statusLine}${excerptBlock}`;

            try {
              const { owner, repo } = context.repo;
              const issue_number = context.issue.number;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number,
                per_page: 100,
              });

              const existing = comments.find(
                (comment) => comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            } catch (error) {
              core.warning(`Could not post lint comment: ${error.message}`);
            }

      - name: Fail job if lint failed
        if: steps.run_lint.outcome == 'failure'
        run: exit 1

  test:
    name: Test and Coverage
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    env:
      COVERAGE_FAIL_UNDER: "80"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt
            src/communicator_app/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install go-task-bin
          python -m pip install -r requirements-dev.txt
          python -m pip install -r requirements.txt
          python -m pip install -r src/communicator_app/requirements.txt

      - name: Run tests with coverage gate
        id: run_tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest -ra \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=${COVERAGE_FAIL_UNDER} \
            --junit-xml=test-results.xml 2>&1 | tee test-output.txt

      - name: Extract coverage percentage
        if: always() && steps.run_tests.outcome == 'success'
        id: coverage
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          coverage_path = Path("coverage.xml")
          if not coverage_path.exists():
              raise SystemExit("coverage.xml was not generated")

          content = coverage_path.read_text(encoding="utf-8")
          match = re.search(r'line-rate="([0-9.]+)"', content)
          if not match:
              raise SystemExit("Could not find line-rate in coverage.xml")

          percent = float(match.group(1)) * 100
          coverage_percent = f"{percent:.2f}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write(f"coverage_percent={coverage_percent}\n")
          PY

      - name: Extract test counts
        if: always()
        id: test_counts
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          results_path = Path("test-results.xml")
          if not results_path.exists():
              for key in ("tests", "failures", "errors", "skipped"):
                  os.environ.get("GITHUB_OUTPUT") and open(os.environ["GITHUB_OUTPUT"], "a").write(f"{key}=0\n")
          else:
              content = results_path.read_text(encoding="utf-8")
              def attr(name):
                  m = re.search(rf'{name}="(\d+)"', content)
                  return int(m.group(1)) if m else 0
              tests    = attr("tests")
              failures = attr("failures")
              errors   = attr("errors")
              skipped  = attr("skipped")
              passed   = tests - failures - errors - skipped
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
                  f.write(f"tests={tests}\n")
                  f.write(f"failures={failures}\n")
                  f.write(f"errors={errors}\n")
                  f.write(f"skipped={skipped}\n")
                  f.write(f"passed={passed}\n")
          PY

      - name: Add coverage to job summary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.run_tests.outcome }}
          COVERAGE_PERCENT: ${{ steps.coverage.outputs.coverage_percent }}
          TESTS: ${{ steps.test_counts.outputs.tests }}
          PASSED: ${{ steps.test_counts.outputs.passed }}
          FAILURES: ${{ steps.test_counts.outputs.failures }}
          ERRORS: ${{ steps.test_counts.outputs.errors }}
          SKIPPED: ${{ steps.test_counts.outputs.skipped }}
        run: |
          {
            echo "## Test Result"
            echo ""
            if [ "$TEST_OUTCOME" = "success" ]; then
              echo "- Status: :white_check_mark: Passed"
            else
              echo "- Status: :x: Failed"
            fi
            echo ""
            echo "| Total | Passed | Failed | Errors | Skipped |"
            echo "|-------|--------|--------|--------|---------|"
            echo "| ${TESTS} | ${PASSED} | ${FAILURES} | ${ERRORS} | ${SKIPPED} |"
            echo ""
            echo "## Coverage Result"
            echo ""
            if [ -n "$COVERAGE_PERCENT" ]; then
              echo "- Coverage: ${COVERAGE_PERCENT}%"
            else
              echo "- Coverage: Not available (tests failed before report generation)"
            fi
            echo "- Required minimum: ${COVERAGE_FAIL_UNDER}%"

            if [ "$TEST_OUTCOME" != "success" ]; then
              echo ""
              echo "### Test failure excerpt"
              echo '```text'
              if [ -f test-output.txt ]; then
                tail -n 60 test-output.txt
              else
                echo "No test output captured."
              fi
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post coverage on PR page
        if: always() && github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- pr-coverage-comment -->';
            const testPassed = '${{ steps.run_tests.outcome }}' === 'success';
            const statusLine = testPassed ? '- Status: ✅ Passed' : '- Status: ❌ Failed';
            const lintPassed = '${{ steps.run_lint.outcome }}' === 'success';
              ? `- Coverage: **${coveragePercent}%**`
              : '- Coverage: **Not available**';
            const tests    = '${{ steps.test_counts.outputs.tests }}'    || '0';
            try {
              const { owner, repo } = context.repo;
              const issue_number = context.issue.number;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
              excerptBlock = `\n\n### Lint failure excerpt\n\`\`\`text\n${excerpt}\n\`\`\``;
                per_page: 100,
              });

              const existing = comments.find(
                (comment) => comment.user.type === 'Bot' && comment.body && comment.body.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number,
                  body,
                });
              }
            } catch (error) {
              core.warning(`Could not post coverage comment: ${error.message}`);
            }

      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload test results
        if: always() && hashFiles('test-results.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml
          path: test-results.xml

      - name: Fail job if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1


