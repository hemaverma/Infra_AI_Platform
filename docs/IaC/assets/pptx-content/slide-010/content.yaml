slide: 10
title: "Cost Profile"
section: "Decisions"
layout: "content"

elements:
  - type: shape
    shape: rectangle
    left: 0
    top: 0
    width: 13.333
    height: 0.08
    fill: "#0078D4"

  - type: textbox
    left: 0.8
    top: 0.4
    width: 10.0
    height: 0.8
    text: "Cost Profile"
    font: "Segoe UI"
    font_size: 32
    font_color: "#1A1A2E"
    font_bold: true
    alignment: left

  - type: table
    left: 0.8
    top: 1.5
    width: 11.5
    height: 3.5
    columns:
      - width: 5.5
      - width: 6.0
    rows:
      - cells:
          - text: "Decision"
            font_bold: true
            fill: "#0078D4"
            font_color: "#F8F8FC"
          - text: "Monthly Savings"
            font_bold: true
            fill: "#0078D4"
            font_color: "#F8F8FC"
      - cells:
          - text: "GHCR vs ACR Premium"
          - text: "$5-50/month"
            font_color: "#10B981"
      - cells:
          - text: "NAT Gateway vs Azure Firewall Standard"
          - text: "$880/month"
            font_color: "#10B981"
      - cells:
          - text: "GitHub-hosted vs Self-hosted runners"
          - text: "$70-150/month"
            font_color: "#10B981"
      - cells:
          - text: "Total Estimated Savings"
            font_bold: true
          - text: "~$1,000-1,100/month"
            font_bold: true
            font_color: "#10B981"
    first_row: true
    horz_banding: true

  - type: card
    left: 0.8
    top: 5.4
    width: 11.5
    height: 1.4
    title: "Compared To"
    title_color: "#1A1A2E"
    title_size: 14
    title_bold: true
    accent_bar: true
    accent_color: "#F59E0B"
    content:
      - bullet: "Enterprise alternatives: ACR Premium + Azure Firewall + Self-hosted VM"
        color: "#4B5563"
      - bullet: "Savings achieved without sacrificing security posture"
        color: "#4B5563"
