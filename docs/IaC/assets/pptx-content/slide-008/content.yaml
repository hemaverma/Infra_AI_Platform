slide: 8
title: "CI/CD Pipeline"
section: "Deployment"
layout: "content"

elements:
  - type: shape
    shape: rectangle
    left: 0
    top: 0
    width: 13.333
    height: 0.08
    fill: "#0078D4"

  - type: textbox
    left: 0.8
    top: 0.4
    width: 10.0
    height: 0.8
    text: "CI/CD Pipeline"
    font: "Segoe UI"
    font_size: 32
    font_color: "#1A1A2E"
    font_bold: true
    alignment: left

  - type: numbered_step
    left: 0.8
    top: 1.5
    width: 11.5
    height: 0.8
    number: 1
    label: "Developer pushes code"
    description: "Code committed to main branch triggers workflow"
    accent_color: "#0078D4"

  - type: numbered_step
    left: 0.8
    top: 2.4
    width: 11.5
    height: 0.8
    number: 2
    label: "GitHub Actions triggers (OIDC auth)"
    description: "Federated credential authenticates to Azure without secrets"
    accent_color: "#0078D4"

  - type: numbered_step
    left: 0.8
    top: 3.3
    width: 11.5
    height: 0.8
    number: 3
    label: "Docker build + tag (SHA + latest)"
    description: "Multi-stage Dockerfile builds optimized container image"
    accent_color: "#10B981"

  - type: numbered_step
    left: 0.8
    top: 4.2
    width: 11.5
    height: 0.8
    number: 4
    label: "Push to GHCR"
    description: "Image pushed to GitHub Container Registry (ghcr.io)"
    accent_color: "#8B5CF6"

  - type: numbered_step
    left: 0.8
    top: 5.1
    width: 11.5
    height: 0.8
    number: 5
    label: "az containerapp update"
    description: "Container App revision created with new image tag"
    accent_color: "#F59E0B"

  - type: textbox
    left: 0.8
    top: 6.3
    width: 11.5
    height: 0.5
    text: "Logic App: Separate Deployment Center sync trigger (no GitHub Actions needed)"
    font: "Segoe UI"
    font_size: 12
    font_color: "#6B7280"
    alignment: center
