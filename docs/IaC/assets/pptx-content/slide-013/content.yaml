slide: 13
title: "Deployment Command"
section: "Operations"
layout: "content"

elements:
  - type: shape
    shape: rectangle
    left: 0
    top: 0
    width: 13.333
    height: 0.08
    fill: "#0078D4"

  - type: textbox
    left: 0.8
    top: 0.4
    width: 10.0
    height: 0.8
    text: "Deployment Command"
    font: "Segoe UI"
    font_size: 32
    font_color: "#1A1A2E"
    font_bold: true
    alignment: left

  - type: shape
    shape: rounded_rectangle
    left: 0.8
    top: 1.5
    width: 11.5
    height: 3.0
    fill: "#1B1F3B"
    corner_radius: 0.12

  - type: textbox
    left: 1.2
    top: 1.7
    width: 10.8
    height: 2.6
    text: "bash src/infra_deployment/deploy.sh \\\n  --variant private \\\n  --resource-group \"NExT-Private\" \\\n  --base-name next \\\n  --location westus3 \\\n  --github-repo \"owner/Infra_AI_Platform\""
    font: "Cascadia Code"
    font_size: 16
    font_color: "#F8F8FC"
    alignment: left

  - type: textbox
    left: 0.8
    top: 4.8
    width: 11.5
    height: 0.5
    text: "Parameters"
    font: "Segoe UI"
    font_size: 16
    font_color: "#1A1A2E"
    font_bold: true
    alignment: left

  - type: table
    left: 0.8
    top: 5.4
    width: 11.5
    height: 1.6
    columns:
      - width: 3.0
      - width: 8.5
    rows:
      - cells:
          - text: "Parameter"
            font_bold: true
            fill: "#0078D4"
            font_color: "#F8F8FC"
          - text: "Description"
            font_bold: true
            fill: "#0078D4"
            font_color: "#F8F8FC"
      - cells:
          - text: "--variant"
            font: "Cascadia Code"
          - text: "private | public"
      - cells:
          - text: "--phase"
            font: "Cascadia Code"
          - text: "Optional: network, services, apps, config (default: all)"
      - cells:
          - text: "--resource-group"
            font: "Cascadia Code"
          - text: "Target Azure resource group name"
      - cells:
          - text: "--base-name"
            font: "Cascadia Code"
          - text: "Prefix for all resource names"
      - cells:
          - text: "--location"
            font: "Cascadia Code"
          - text: "Azure region (e.g., westus3)"
      - cells:
          - text: "--github-repo"
            font: "Cascadia Code"
          - text: "GitHub repo for OIDC federation (owner/repo)"
    first_row: true
    horz_banding: true
