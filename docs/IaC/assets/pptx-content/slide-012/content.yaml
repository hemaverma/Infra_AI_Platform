slide: 12
title: "Developer Experience"
section: "Operations"
layout: "content"

elements:
  - type: shape
    shape: rectangle
    left: 0
    top: 0
    width: 13.333
    height: 0.08
    fill: "#0078D4"

  - type: textbox
    left: 0.8
    top: 0.4
    width: 10.0
    height: 0.8
    text: "Developer Experience"
    font: "Segoe UI"
    font_size: 32
    font_color: "#1A1A2E"
    font_bold: true
    alignment: left

  - type: card
    left: 0.8
    top: 1.5
    width: 5.5
    height: 2.8
    title: "Access & Connectivity"
    title_color: "#1A1A2E"
    title_size: 15
    title_bold: true
    accent_bar: true
    accent_color: "#0078D4"
    content:
      - bullet: "P2S VPN with Entra ID (no certificates)"
        color: "#4B5563"
      - bullet: "DNS Private Resolver for private FQDN resolution"
        color: "#4B5563"
      - bullet: "Azure VPN Client (Windows/macOS)"
        color: "#4B5563"

  - type: card
    left: 6.8
    top: 1.5
    width: 5.5
    height: 2.8
    title: "Development Tools"
    title_color: "#1A1A2E"
    title_size: 15
    title_bold: true
    accent_bar: true
    accent_color: "#10B981"
    content:
      - bullet: "VS Code Dev Container support"
        color: "#4B5563"
      - bullet: "GitHub Codespaces for public variant"
        color: "#4B5563"
      - bullet: "Docker Compose for local development"
        color: "#4B5563"

  - type: card
    left: 0.8
    top: 4.7
    width: 11.5
    height: 2.0
    title: "Deployment Simplicity"
    title_color: "#1A1A2E"
    title_size: 15
    title_bold: true
    accent_bar: true
    accent_color: "#F59E0B"
    content:
      - bullet: "Single deploy.sh command for full infrastructure provisioning"
        color: "#4B5563"
      - bullet: "Phase-based deployment: network -> services -> apps -> config"
        color: "#4B5563"
      - bullet: "Idempotent - safe to re-run at any time"
        color: "#4B5563"
