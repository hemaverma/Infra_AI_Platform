slide: 6
title: "Container App Deployment Flow"
section: "Deployment"
layout: "content"

elements:
  - type: shape
    shape: rectangle
    left: 0
    top: 0
    width: 13.333
    height: 0.08
    fill: "#0078D4"

  - type: textbox
    left: 0.8
    top: 0.4
    width: 10.0
    height: 0.8
    text: "Container App Deployment Flow"
    font: "Segoe UI"
    font_size: 32
    font_color: "#1A1A2E"
    font_bold: true
    alignment: left

  - type: arrow_flow
    left: 0.8
    top: 2.0
    width: 11.5
    height: 2.0
    items:
      - label: "git push"
        color: "#6B7280"
      - label: "GitHub Actions"
        color: "#0078D4"
      - label: "Docker Build"
        color: "#10B981"
      - label: "GHCR Push"
        color: "#8B5CF6"
      - label: "az containerapp\nupdate"
        color: "#F59E0B"

  - type: card
    left: 0.8
    top: 4.5
    width: 11.5
    height: 2.2
    title: "Key Details"
    title_color: "#1A1A2E"
    title_size: 14
    title_bold: true
    accent_bar: true
    accent_color: "#0078D4"
    content:
      - bullet: "Runner: GitHub-hosted (ubuntu-latest)"
        color: "#4B5563"
      - bullet: "Authentication: OIDC federation (no stored secrets)"
        color: "#4B5563"
      - bullet: "Registry: GitHub Container Registry (GHCR)"
        color: "#4B5563"
      - bullet: "No VNet access needed - az CLI updates via ARM API"
        color: "#4B5563"
