slide: 7
title: "Logic App Deployment (Deployment Center)"
section: "Deployment"
layout: "content"

elements:
  - type: shape
    shape: rectangle
    left: 0
    top: 0
    width: 13.333
    height: 0.08
    fill: "#0078D4"

  - type: textbox
    left: 0.8
    top: 0.4
    width: 11.0
    height: 0.8
    text: "Logic App Deployment (Deployment Center)"
    font: "Segoe UI"
    font_size: 32
    font_color: "#1A1A2E"
    font_bold: true
    alignment: left

  - type: arrow_flow
    left: 0.8
    top: 2.0
    width: 11.5
    height: 2.0
    items:
      - label: "git push"
        color: "#6B7280"
      - label: "Sync Trigger"
        color: "#0078D4"
      - label: "Kudu Git Pull"
        color: "#10B981"
      - label: "NAT Gateway\n-> GitHub"
        color: "#F59E0B"
      - label: ".deployment\n-> wwwroot"
        color: "#8B5CF6"

  - type: card
    left: 0.8
    top: 4.5
    width: 11.5
    height: 2.2
    title: "Key Details"
    title_color: "#1A1A2E"
    title_size: 14
    title_bold: true
    accent_bar: true
    accent_color: "#10B981"
    content:
      - bullet: "No external runner needed"
        color: "#4B5563"
      - bullet: "NAT Gateway provides outbound connectivity to GitHub"
        color: "#4B5563"
      - bullet: "Custom .deployment command for monorepo path mapping"
        color: "#4B5563"
      - bullet: "Kudu handles build and deployment to wwwroot"
        color: "#4B5563"
